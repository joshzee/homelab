apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000 # Node group ID
        runAsUser: 1000 # Node user ID
        runAsGroup: 1000 # Node group ID
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: fix-volume-ownership
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - chown -R 1000:1000 /config /metadata /audiobooks /podcasts
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            - name: audiobookshelf-config
              mountPath: /config
            - name: audiobookshelf-metadata
              mountPath: /metadata
            - name: audiobookshelf-audiobooks
              mountPath: /audiobooks
            - name: audiobookshelf-podcasts
              mountPath: /podcasts

      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.36.1
          ports:
            - name: http
              containerPort: 3005
          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap
          
          volumeMounts:
            - name: audiobookshelf-config
              mountPath: /config
            
            - name: audiobookshelf-metadata
              mountPath: /metadata
            
            - name: audiobookshelf-audiobooks
              mountPath: /audiobooks
            
            - name: audiobookshelf-podcasts
              mountPath: /podcasts

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: audiobookshelf-config
          persistentVolumeClaim:
            claimName: audiobookshelf-config-pvc
        
        - name: audiobookshelf-metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata-pvc
        
        - name: audiobookshelf-audiobooks
          persistentVolumeClaim:
            claimName: audiobookshelf-audiobooks-pvc
        
        - name: audiobookshelf-podcasts
          persistentVolumeClaim:
            claimName: audiobookshelf-podcasts-pvc
